name: Обновяване и публикуване

# При всяка промяна в кода, всеки час и на 15 мин. през борсовите часове в САЩ: обновява data/*.json и публикува сайта.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"              # всеки час
    - cron: "*/15 13-21 * * 1-5"      # на 15 мин., докато борсата в САЩ работи (пон–пет, UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обнови данните
        run: python tools/update_data.py
      - name: Запиши данните в repo-то
        run: |
          git config user.name "more-btc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Обновени данни" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
